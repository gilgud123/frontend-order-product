<div class="logout-container">
  <div class="logout-card">
    @if (isProcessing()) {
      <div class="logout-content">
        <div class="spinner"></div>
        <h2 class="logout-title">Logging Out</h2>
        <p class="logout-message">Please wait while we securely log you out...</p>
      </div>
    } @else if (isComplete()) {
      <div class="logout-content success">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h2 class="logout-title">Logged Out Successfully</h2>
        <p class="logout-message">You have been securely logged out</p>
        <p class="logout-submessage">Redirecting to home page...</p>
      </div>
    }
  </div>
</div>
