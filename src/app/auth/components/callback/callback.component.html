<div class="callback-container">
  @if (isProcessing()) {
    <div class="callback-content">
      <div class="spinner"></div>
      <h2 class="callback-title">Processing Authentication</h2>
      <p class="callback-message">Please wait while we complete your login...</p>
    </div>
  } @else if (errorMessage()) {
    <div class="callback-content error">
      <div class="error-icon">??</div>
      <h2 class="callback-title">Authentication Failed</h2>
      <p class="callback-message">{{ errorMessage() }}</p>
      <p class="callback-submessage">Redirecting to home page...</p>
    </div>
  } @else {
    <div class="callback-content success">
      <div class="success-icon">?</div>
      <h2 class="callback-title">Authentication Successful</h2>
      <p class="callback-message">Redirecting...</p>
    </div>
  }
</div>
